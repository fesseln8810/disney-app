<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Tokyo Disney Resort Show Schedule</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  background: linear-gradient(#0b1e3f, #1c3d7a);
  color: white;
}

.card {
  background: rgba(255,255,255,0.9);
  color: #333;
  border-radius: 16px;
}
</style>
</head>

<body>

<h1>ディズニーショースケジュール</h1>

<label>パーク</label><br>
<select id="park">
  <option value="tdl">ディズニーランド</option>
  <option value="tds">ディズニーシー</option>
</select>

<br><br>

<label>日付</label><br>
<input type="date" id="date">

<br><br>

<button type="button" onclick="fetchData()">取得する</button>

<hr>

<div id="result"></div>

<script>
async function fetchData() {
  const park = document.getElementById("park").value;
  const date = document.getElementById("date").value.replaceAll("-", "");

  const resultDiv = document.getElementById("result");
  resultDiv.innerHTML = "取得中...";

  try {
    const url = `https://corsproxy.io/?https://www.tokyodisneyresort.jp/${park}/daily/calendar/${date}/`;

    const res = await fetch(url);
    if (!res.ok) throw new Error("通信失敗");

    const html = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");

    resultDiv.innerHTML = "";

const cards = doc.querySelectorAll("li");

let seen = new Set();
let count = 0;

cards.forEach(card => {
  const text = card.innerText.trim();

    // 不要なもの除外
  if (
    text.includes("開園時間") ||
    text.includes("当日のスケジュール") ||
    text.includes("グリーティング")
  ) return;

  const times = text.match(/\d{1,2}:\d{2}/g);
  if (!times) return;

  const lines = text.split("\n").map(l => l.trim()).filter(l => l !== "");

  let name = lines.find(l =>
    !l.match(/\d{1,2}:\d{2}/) &&
    l.length > 3
  );

  if (!name) return;

  // 軽くクリーン
  name = name
    .replace(/【.*?】/g, "")
    .replace(/\d{1,2}:\d{2}.*/g, "")
    .trim();

  if (seen.has(name)) return;
  seen.add(name);

  const uniqueTimes = [...new Set(times)];

  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <div style="font-weight:bold; font-size:16px;">${name}</div>
    <div style="margin-top:4px;">🕒 ${uniqueTimes.join(" / ")}</div>
  `;

  resultDiv.appendChild(div);
  count++;
});

if (count === 0) {
  resultDiv.innerHTML = "スケジュールが見つかりません";
}
  } catch (err) {
    console.error(err);
    resultDiv.innerHTML = "取得に失敗しました（通信エラー）";
  }
}
</script>

</body>
</html>
