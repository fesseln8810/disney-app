<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Tokyo Disney Resort Show Schedule</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: -apple-system;
  padding: 16px;
  background: #f5f5f5;
}

.card {
  border-radius: 12px;
  padding: 12px;
  margin: 10px 0;
  background: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
</style>
</head>

<body>

<h1>ディズニーショースケジュール</h1>

<label>パーク</label><br>
<select id="park">
  <option value="tdl">ディズニーランド</option>
  <option value="tds">ディズニーシー</option>
</select>

<br><br>

<label>日付</label><br>
<input type="date" id="date">

<br><br>

<button type="button" onclick="fetchData()">取得する</button>

<hr>

<div id="result"></div>

<script>
async function fetchData() {
  const park = document.getElementById("park").value;
  const date = document.getElementById("date").value.replaceAll("-", "");

  const resultDiv = document.getElementById("result");
  resultDiv.innerHTML = "取得中...";

  try {
    const url = `https://corsproxy.io/?https://www.tokyodisneyresort.jp/${park}/daily/calendar/${date}/`;

    const res = await fetch(url);
    if (!res.ok) throw new Error("通信失敗");

    const html = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");

    resultDiv.innerHTML = "";

const cards = doc.querySelectorAll("li.scheduleList__item");

let seen = new Set();
let count = 0;

cards.forEach(card => {
  const text = card.innerText.trim();

  // 不要なもの除外（強化版）
  if (
    text.includes("開園時間") ||
    text.includes("当日のスケジュール") ||
    text.includes("グリーティング")
  ) return;

  // 時間取得
  const times = text.match(/\d{1,2}:\d{2}/g);
  if (!times || times.length > 5) return; // ←多すぎるのは除外

  // 名前取得（aタグ優先）
  let name = card.querySelector("a")?.innerText;

  // 不要な文言を削除
  name = name
  .replace(/【.*?】/g, "") // 【環境演出】削除
  .replace(/エントリー受付対象/g, "")
  .replace(/ディズニー・プレミアアクセス対象/g, "")
  .replace(/\d{1,2}:\d{2}.*/g, "") // 時間以降削除
  .trim();

  const lines = text.split("\n").map(l => l.trim()).filter(l => l !== "");

  if (!name) {
    name = lines.find(l =>
      !l.match(/\d{1,2}:\d{2}/) &&
      l.length > 5
    );
  }

  if (!name) return;

  // 重複防止
  if (seen.has(name)) return;
  seen.add(name);

  // 時間整理（重複削除＋最大5個まで）
  const uniqueTimes = [...new Set(times)].slice(0, 5);

  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <div style="font-weight:bold; font-size:16px;">${name}</div>
    <div style="margin-top:4px;">🕒 ${uniqueTimes.join(" / ")}</div>
  `;

  resultDiv.appendChild(div);
  count++;
});

if (count === 0) {
  resultDiv.innerHTML = "スケジュールが見つかりません（未公開 or 構造変更）";
}

  } catch (err) {
    console.error(err);
    resultDiv.innerHTML = "取得に失敗しました（通信エラー）";
  }
}
</script>

</body>
</html>
