<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Tokyo Disney Resort Show Schedule</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  background: linear-gradient(#0b1e3f, #1c3d7a);
  color: white;
}

.card {
  background: rgba(255,255,255,0.9);
  color: #333;
  border-radius: 16px;
}
</style>
</head>

<body>

<h1>ディズニーショースケジュール</h1>

<label>パーク</label><br>
<select id="park">
  <option value="tdl">ディズニーランド</option>
  <option value="tds">ディズニーシー</option>
</select>

<br><br>

<label>日付</label><br>
<input type="date" id="date">

<br><br>

<button type="button" onclick="fetchData()">取得する</button>

<hr>

<div id="result"></div>

<script>
async function fetchData() {
  const park = document.getElementById("park").value;
  const date = document.getElementById("date").value.replaceAll("-", "");

  const resultDiv = document.getElementById("result");
  resultDiv.innerHTML = "取得中...";

  try {
    const url = `https://corsproxy.io/?https://www.tokyodisneyresort.jp/${park}/daily/calendar/${date}/`;

    const res = await fetch(url);
    if (!res.ok) throw new Error("通信失敗");

    const html = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");

    resultDiv.innerHTML = "";

    const timeline = document.createElement("div");
timeline.style.position = "relative";
timeline.style.height = "30px";
timeline.style.marginBottom = "10px";

const start = 9 * 60;
const end = 21 * 60;

for (let h = 9; h <= 21; h++) {
  const percent = ((h * 60 - start) / (end - start)) * 100;

  const label = document.createElement("div");
  label.style.position = "absolute";
  label.style.left = percent + "%";
  label.style.transform = "translateX(-50%)";
  label.style.fontSize = "10px";
  label.innerText = `${h}:00`;

  timeline.appendChild(label);
}

resultDiv.appendChild(timeline);

const cards = doc.querySelectorAll("li");

let seen = new Set();
let count = 0;

cards.forEach(card => {
  const text = card.innerText.trim();

    // 不要なもの除外
  if (
    text.includes("開園時間") ||
    text.includes("当日のスケジュール") ||
    text.includes("ミッキーの家とミート・ミッキー") ||
    text.includes("ミニーのスタイルスタジオ") ||
    text.includes("グリーティング")
  ) return;

  const times = text.match(/\d{1,2}:\d{2}/g);
  if (!times) return;

  const lines = text.split("\n").map(l => l.trim()).filter(l => l !== "");

  let name = lines.find(l =>
    !l.match(/\d{1,2}:\d{2}/) &&
    l.length > 3
  );

  if (!name) return;

  // 軽くクリーン
  name = name
    .replace(/【.*?】/g, "")
    .replace(/\d{1,2}:\d{2}.*/g, "")
    .trim();

  if (seen.has(name)) return;
  seen.add(name);

  const uniqueTimes = [...new Set(times)];

  const div = document.createElement("div");
  div.className = "card";

  const firstTime = uniqueTimes[0]; // 一番早い時間
const [hour, min] = firstTime.split(":").map(Number);

// 9:00〜21:00を基準にする（ディズニー想定）
const start = 9 * 60;
const end = 21 * 60;

const current = hour * 60 + min;
const percent = ((current - start) / (end - start)) * 100;

const dots = uniqueTimes.map(t => {
  const [hour, min] = t.split(":").map(Number);
  const current = hour * 60 + min;
  const percent = ((current - start) / (end - start)) * 100;

  return `
    <div style="
      position:absolute;
      left:${percent}%;
      top:50%;
      transform:translate(-50%, -50%);
      font-size:12px;
    ">●</div>
  `;
}).join("");

div.innerHTML = `
  <div style="font-weight:bold;">${name}</div>
  <div style="
    position:relative;
    height:24px;
    background:#eee;
    border-radius:12px;
    margin-top:6px;
  ">
    ${dots}
  </div>
  <div style="font-size:12px; margin-top:4px;">
    🕒 ${uniqueTimes.join(" / ")}
  </div>
`;

  resultDiv.appendChild(div);
  count++;
});

if (count === 0) {
  resultDiv.innerHTML = "スケジュールが見つかりません";
}
  } catch (err) {
    console.error(err);
    resultDiv.innerHTML = "取得に失敗しました（通信エラー）";
  }
}
</script>

</body>
</html>
